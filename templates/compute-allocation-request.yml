# AI Club Nalanda University - Compute Allocation Specification
version: "1.0"
project:
  codename: "pali-ocr-transformer"
  github_repo: "https://github.com/nalanda-ai-club/pali-ocr"
  lead_name: "Lead Researcher"
  lead_email: "lead@nalandauniv.edu.in"
  pod_members:
    - "lead@nalandauniv.edu.in"
    - "domain_specialist@nalandauniv.edu.in"

allocation_details:
  tier: "Tier-2" # Tier-1 (Free/Self-service), Tier-2 (Micro-Quota <₹3000), Tier-3 (Cluster)
  provider: "RunPod" # Options: RunPod, GCP, AWS, OpenAI_API, Anthropic_API, Gemini_API
  hardware_type: "1x RTX 4090 (24GB VRAM)"
  estimated_gpu_hours: 40
  estimated_cost_inr: 2200
  start_date: "2026-10-01"
  end_date: "2026-10-15"

workload_specification:
  framework: "PyTorch 2.4 / Hugging Face Transformers"
  dataset_size_gb: 4.5
  batch_size: 16
  max_runtime_per_job_hours: 6
  idle_auto_shutdown_minutes: 30

safety_and_hygiene:
  keys_vault_confirmed: true
  public_loss_curves_agreement: true
  open_source_commitment: true
