name: AI Club Operations CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-all:
    name: Verify Operations, SOPs & Schemas
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install jsonschema pyyaml

      - name: Run Repository Integrity Audit
        run: |
          python -m ai_club_ops.cli audit

      - name: Compile Unified Handbook & Check for Stale Build
        run: |
          python scripts/build_docs.py
          git diff --exit-code HANDBOOK.md || (echo "❌ HANDBOOK.md is out of date! Run 'ai-ops compile' or 'python scripts/build_docs.py' and commit the result." && exit 1)

      - name: Validate Default Proposal & Compute Templates
        run: |
          python -m ai_club_ops.cli validate templates/project-proposal-template.md
          python -m ai_club_ops.cli validate templates/compute-allocation-request.yml

      - name: Run Unit Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
