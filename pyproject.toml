[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-club-ops"
version = "1.0.0"
description = "Administrative SOPs, Innovation Policies, and Operations CLI for AI Club, Nalanda University"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AI Club, Nalanda University", email = "aiclub@nalandalibrary.com"}
]
keywords = ["ai-club", "nalanda-university", "governance", "sops", "innovation-policies", "operations"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.17.0"
]

[project.scripts]
ai-ops = "ai_club_ops.cli:main"

[project.urls]
Homepage = "https://aiclub.nalandalibrary.com"
Repository = "https://github.com/DayDreamer-commits/ai-club-ops"
